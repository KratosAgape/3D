<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Viewer</title>
   
    <!-- Google's Model Viewer component -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>

    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        model-viewer {
            width: 100%;
            height: 100vh;
            background-color: #aaaaaa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- 
      - Make sure "test.glb" and "wooden_studio_08_4k.hdr" are 
        in the exact same folder as this HTML file!
      - Removed the manual scale="0.1 0.1 0.1" so it fits nicely.
    -->
    <model-viewer 
        src="test.glb" 
        alt="A 3D model exported from Blender" 
        camera-controls 
        auto-rotate 
        ar 
        shadow-intensity="1"
        exposure="1" 
        environment-image="wooden_studio_08_4k.hdr">
    </model-viewer>
    
</body>
</html>
