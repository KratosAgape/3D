<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Viewer</title>
   

 <!-- 1. ES Module Shims: Required for importmaps to work reliably in all browsers -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.5.1/dist/es-module-shims.js" crossorigin="anonymous"></script>

    <!-- 2. Import Map: Maps "three" and "three/addons/" paths to the unpkg CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com",
          "three/addons/": "https://unpkg.com"
        }
      }
    </script>
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>

    <!-- 2. Simple CSS styling to center the 3D canvas -->
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        model-viewer {
            width: 100%;
            height: 100vh;
            background-color: #aaaaaa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .hide {
            display: none;
        }
    </style>


</head>
<body>


    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        // Fix 1: Import MeshoptDecoder from the addons directory
        import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
        
        // Fix 2: Replace RGBELoader with the newer HDRLoader
        import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

        // --- Basic Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Recommended for HDR assets
        document.body.appendChild(renderer.domElement);

        // --- Load HDR Environment (Fixes RGBELoader Deprecation) ---
        const hdrLoader = new HDRLoader();
        hdrLoader.load('path/to/your/environment.hdr', (texture) => {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = texture; // Applies lighting to the model
            scene.background = texture;  // Optional: Shows HDR as background
        });

        // --- Load glTF Model (Fixes Meshopt Decoder Error) ---
        const gltfLoader = new GLTFLoader();
        
        // Crucial Line: This tells GLTFLoader how to unpack the compressed mesh data
        gltfLoader.setMeshoptDecoder(MeshoptDecoder);

        gltfLoader.load('path/to/your/compressed-model.gltf', 
            (gltf) => {
                scene.add(gltf.scene);
                console.log("Model loaded successfully!");
            },
            (progress) => {
                console.log(`Loading: ${(progress.loaded / progress.total * 100).toFixed(2)}%`);
            },
            (error) => {
                console.error("An error happened while loading the model:", error);
            }
        );

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
    <model-viewer 
        src="test.glb" alt="A 3D model exported from Blender" camera-controls auto-rotate ar shadow-intensity="1"exposure="1" environment-image="wooden_studio_08_4k.hdr" scale="0.1 0.1 0.1" >
    </model-viewer>
    
</body>
</html>
