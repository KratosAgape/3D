<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Viewer</title>
    <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com",
      "three/addons/": "https://unpkg.com"
    }
  }
</script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>

    <!-- 2. Simple CSS styling to center the 3D canvas -->
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        model-viewer {
            width: 100%;
            height: 100vh;
            background-color: #aaaaaa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .hide {
            display: none;
        }
    </style>


</head>
<body>

    <model-viewer 
        src="test.glb" alt="A 3D model exported from Blender" camera-controls auto-rotate ar shadow-intensity="1"exposure="1" environment-image="wooden_studio_08_4k.hdr" scale="0.1 0.1 0.1" >
    </model-viewer>
    
</body>
</html>
