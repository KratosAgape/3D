<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Viewer</title>
   
    <!-- 1. Import Google's Model Viewer component -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>

    <!-- 2. Configure the Meshopt Decoder BEFORE the model loads -->
    <script type="module">
        const ModelViewerElement = customsElements?.get('model-viewer') || window.customElements.get('model-viewer');
        
        if (ModelViewerElement) {
            // This provides the missing decoder required by your compressed .glb file
            ModelViewerElement.meshoptDecoderLocation = 'https://unpkg.com/meshoptimizer@0.17.0/meshopt_decoder.js';
        }
    </script>

    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        model-viewer {
            width: 100%;
            height: 100vh;
            background-color: #aaaaaa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- 
      - The custom scripts tag from your previous code has been removed.
      - Ensure 'test.glb' and 'wooden_studio_08_4k.hdr' exist in this folder!
    -->
    <model-viewer 
        src="test.glb" 
        alt="A 3D model exported from Blender" 
        camera-controls 
        auto-rotate 
        ar 
        shadow-intensity="1"
        exposure="1" 
        environment-image="wooden_studio_08_4k.hdr">
    </model-viewer>
    
</body>
</html>
